name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish & overwrite the current release assets (v3.1.0)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: luxai-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-packages:
    name: Linux packages (deb/rpm/AppImage/zst)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm zstd binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix >/dev/null

      - name: Build packages
        run: bash packaging/build-all.sh "${{ github.ref_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luxai-linux-packages
          path: |
            .work/dist/*.deb
            .work/dist/*.rpm
            .work/dist/*.AppImage
            .work/dist/*.pkg.tar.zst
            .work/dist/SHA256SUMS
          if-no-files-found: error

  windows-exe:
    name: Windows installer (exe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm zstd binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix >/dev/null

      - name: Build Linux packages first (exe embeds the deb)
        run: bash packaging/build-all.sh

      - name: Build Windows exe
        run: bash packaging/build-exe.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxai-windows-exe
          path: .work/dist/*.exe
          if-no-files-found: error

  windows-native:
    name: Windows native exe (no WSL, Win7+)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip >/dev/null

      - name: Build LuxAI.exe (native Win32 x64, Windows 7 SP1+)
        run: bash windows/build-win.sh

      - name: Build LuxAI-Setup-native.exe (embeds LuxAI.exe)
        run: bash windows/build-installer.sh

      - name: Stage release files
        run: |
          mkdir -p dist-win/pkg
          cp windows/build/LuxAI.exe       dist-win/pkg/
          cp windows/build/LuxAI-Setup.exe dist-win/LuxAI-3.1.0-Setup-native.exe
          cp windows/build/LuxAI-Setup.exe dist-win/pkg/LuxAI-3.1.0-Setup-native.exe
          cp windows/README-TR.md          dist-win/pkg/README-TR.md
          cp docs/ANALIZ-WINDOWS.md        dist-win/pkg/ANALIZ-WINDOWS.md
          mkdir -p dist-win/pkg/docs
          cp -r windows/docs/screens       dist-win/pkg/docs/
          ( cd dist-win/pkg && zip -qr ../LuxAI-3.1.0-Windows-native-x64.zip . )
          ls -lh dist-win dist-win/pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luxai-windows-native
          path: |
            dist-win/LuxAI-3.1.0-Windows-native-x64.zip
            dist-win/LuxAI-3.1.0-Setup-native.exe
          if-no-files-found: error

  screenshots:
    name: Real GUI screenshots (runner)
    needs: [linux-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime, capture and font deps
        run: |
          sudo apt-get update -qq
          # fonts-noto-core brings Noto Sans Devanagari for the Hindi capture
          sudo apt-get install -y -qq xvfb fonts-noto-core >/dev/null
          python3 -m pip install --quiet python-xlib pillow

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: luxai-linux-packages
          path: dist

      - name: Install LuxAI from the built deb
        run: sudo apt-get install -y ./dist/luxai_3.1.0_amd64.deb

      - name: Run the real GUI under Xvfb and capture screenshots
        run: python3 packaging/capture_gui.py / /tmp/shots tr,en,hi

      - name: Copy screenshots into the promo folder
        run: |
          mkdir -p promo/assets/screens/runner
          cp /tmp/shots/luxai-tr.png /tmp/shots/luxai-en.png /tmp/shots/luxai-hi.png promo/assets/screens/runner/
          ls -la promo/assets/screens/runner/

      - name: Commit real screenshots to the repo
        run: |
          git config user.name "BELGESELSEMO CI"
          git config user.email "belgeselsemo@belgeselsemo.com.tr"
          git add promo/assets/screens/runner
          if git diff --cached --quiet; then
            echo "screenshots unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "[skip ci] gerçek runner ekran görüntüleri (${GITHUB_SHA::7})"
          git push

  release:
    name: Publish GitHub release
    needs: [linux-packages, windows-exe, windows-native, screenshots]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.AppImage *.pkg.tar.zst *.exe *.zip > SHA256SUMS

      - name: Determine release tag
        id: tag
        run: echo "tag=${{ github.ref_type == 'tag' && github.ref_name || 'v3.1.0' }}" >> "$GITHUB_OUTPUT"

      - name: Remove old assets so the rebuild replaces them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for a in $(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null || true); do
            gh release delete-asset "$TAG" "$a" --repo "${{ github.repository }}" --yes || true
          done

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: LuxAI ${{ steps.tag.outputs.tag }} — %100 çok dilli paketler
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.pkg.tar.zst
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
