name: video-record-v5-win-launch

on:
  workflow_dispatch:
  push:
    branches: [video-live-record]
    paths: ['.github/workflows/video-record-v5.yml']

permissions:
  contents: read

env:
  REL: https://github.com/vesvese55x/LuxAI-the-AI-assistant-for-LuxOS/releases/download/v2.0.2

jobs:
  windows-v5:
    name: V5 Windows - kurulum + Baslat menusunden acma + GUI
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile f.zip
          Expand-Archive f.zip -DestinationPath ff -Force
          $bin=(Get-ChildItem ff -Recurse -Filter ffmpeg.exe|Select-Object -First 1).FullName
          "FFMPEG=$bin"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Kayit (330 sn)
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          New-Item -ItemType Directory -Force -Path rec | Out-Null
          $ff=$env:FFMPEG
          $rec=Start-Process $ff -ArgumentList '-y','-f','gdigrab','-framerate','25','-i','desktop','-t','326','-c:v','libx264','-preset','veryfast','-pix_fmt','yuv420p','-movflags','+faststart','rec/windows_v5.mp4' -PassThru -NoNewWindow
          Start-Sleep 4
          $ws=New-Object -ComObject WScript.Shell
          # 1) cmd ile kurulum
          Start-Process cmd; Start-Sleep 3
          $ws.SendKeys('curl -L -o luxai-kur.bat https://raw.githubusercontent.com/vesvese55x/LuxAI-the-AI-assistant-for-LuxOS/video-live-record/windows/cmd/luxai-kur.bat && call luxai-kur.bat'); $ws.SendKeys('{ENTER}')
          Start-Sleep 70
          & powershell -NoProfile -ExecutionPolicy Bypass -File windows/tests/screenshot.ps1 -Out rec/w_install_done.png -FullScreen
          $exe="$env:ProgramFiles\LuxAI\LuxAI.exe"; if(!(Test-Path $exe)){ $exe="$env:LOCALAPPDATA\Programs\LuxAI\LuxAI.exe" }
          Write-Host "EXE=$exe exists=$(Test-Path $exe)"
          # 2) Baslat menusunden acma: arama servisini ac, Baslat'i ac, LuxAI yaz, Enter
          try{ Set-Service WSearch -StartupType Automatic; Start-Service WSearch }catch{}
          Start-Sleep 5
          $ws.SendKeys('^{ESC}'); Start-Sleep 3
          $ws.SendKeys('LuxAI'); Start-Sleep 7
          & powershell -NoProfile -ExecutionPolicy Bypass -File windows/tests/screenshot.ps1 -Out rec/w_start_search.png -FullScreen
          $ws.SendKeys('{ENTER}'); Start-Sleep 12
          & powershell -NoProfile -ExecutionPolicy Bypass -File windows/tests/screenshot.ps1 -Out rec/w_launched.png -FullScreen
          try{ Get-Process LuxAI -ErrorAction SilentlyContinue|Stop-Process -Force }catch{}
          Start-Sleep 2
          # 3) GUI sahneleri
          Start-Process python -ArgumentList "windows/tests/mock_server.py","8777"; Start-Sleep 3
          $dir="$env:APPDATA\LuxAI"; New-Item -ItemType Directory -Force -Path $dir|Out-Null
          function Scene($a,$w,$n){ try{ Get-Process LuxAI -ErrorAction SilentlyContinue|Stop-Process -Force; Start-Sleep 2; Start-Process $exe -ArgumentList $a; Start-Sleep $w; & powershell -NoProfile -ExecutionPolicy Bypass -File windows/tests/screenshot.ps1 -Out "rec/$n" -FullScreen }catch{ Write-Warning $_ } }
          @("model=0","mode=1","lang=0","theme=1","send_ctrl_enter=0","auto_approve=1","max_tokens=4096","stream=1","use_openai=1","endpoint=http://127.0.0.1:8777/v1/chat/completions","api_key=ci","workdir=$env:USERPROFILE")|Set-Content -Encoding ASCII "$dir\settings.ini"
          Scene '--theme 1 --mode 1 --lang 0 --ask "Sistem bilgini göster ve disk kullanımını özetle"' 20 w_agent.png
          try{ Get-Process python -ErrorAction SilentlyContinue|Stop-Process -Force }catch{}; Start-Sleep 1
          $env:LUXAI_MOCK_TOOL="run_command"; Start-Process python -ArgumentList "windows/tests/mock_server.py","8777"; Start-Sleep 3
          @("model=0","mode=1","lang=0","theme=1","send_ctrl_enter=0","auto_approve=0","max_tokens=4096","stream=1","use_openai=1","endpoint=http://127.0.0.1:8777/v1/chat/completions","api_key=ci","workdir=$env:USERPROFILE")|Set-Content -Encoding ASCII "$dir\settings.ini"
          Scene '--theme 1 --mode 1 --lang 0 --ask "Bir komut calistir"' 16 w_permission.png
          Scene '--theme 2 --mode 1 --lang 1 --ask "Show my system information"' 14 w_dark_en.png
          Scene '--theme 1 --lang 0 --projects' 13 w_projects.png
          Scene '--theme 1 --lang 0' 12 w_welcome.png
          $rec.WaitForExit(200000)|Out-Null
          Get-ChildItem rec|Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v5-windows, path: rec/*, if-no-files-found: warn}
